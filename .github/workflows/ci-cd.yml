name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==============================
  # BUILD, TEST AND PUSH
  # ==============================
  build-test-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t manojwip/ga_demo:${{ github.sha }} \
            -t manojwip/ga_demo:latest .

      - name: Push Docker image
        run: |
          docker push manojwip/ga_demo:${{ github.sha }}
          docker push manojwip/ga_demo:latest


  # ==============================
  # DEPLOY TO EC2
  # ==============================
  deploy-to-ec2:

    needs: build-test-push

    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Deploying application..."

            docker pull manojwip/ga_demo:latest

            docker stop ga_demo || true
            docker rm ga_demo || true

            docker run -d \
              --name ga_demo \
              -p 5000:5000 \
              --restart unless-stopped \
              manojwip/ga_demo:latest

            echo "Deployment completed!"

            docker ps